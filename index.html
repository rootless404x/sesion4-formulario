<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro al Webinar</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <div class="container py-5">

        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">

                <h1 class="text-center mb-4">Registro al Webinar</h1>

                <form>

                    
                    <div class="mb-3">
                        <label for="nombre" class="form-label">
                            Nombre completo
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="nombre"
                            name="nombre"
                            placeholder="Ingrese su nombre completo"
                            required
                        >
                    </div>

                    
                    <div class="mb-3">
                        <label for="correo" class="form-label">
                            Correo electrónico
                        </label>

                        <input
                            type="email"
                            class="form-control"
                            id="correo"
                            name="correo"
                            placeholder="ejemplo@correo.com"
                            required
                        >
                    </div>

                    
                    <div class="mb-3">
                        <label for="edad" class="form-label">
                            Edad
                        </label>

                        <input
                            type="number"
                            class="form-control"
                            id="edad"
                            name="edad"
                            min="16"
                            max="99"
                            required
                        >
                    </div>

                    
                    <div class="mb-3">
                        <label for="fechaNacimiento" class="form-label">
                            Fecha de nacimiento
                        </label>

                        <input
                            type="date"
                            class="form-control"
                            id="fechaNacimiento"
                            name="fechaNacimiento"
                        >
                    </div>

                    
                    <div class="mb-3">
                        <label for="pais" class="form-label">
                            País
                        </label>

                        <select
                            class="form-select"
                            id="pais"
                            name="pais"
                            required
                        >
                            <option value="">Seleccione su país</option>
                            <option value="peru">Perú</option>
                            <option value="alemania">Alemania</option>
                            <option value="colombia">Colombia</option>
                            <option value="chile">Chile</option>
                            <option value="argentina">Argentina</option>
                        </select>
                    </div>

                    
                    <div class="mb-3">

                        <label class="form-label">
                            Tipo de participación
                        </label>

                        <div class="form-check">
                            <input
                                type="radio"
                                class="form-check-input"
                                id="presencial"
                                name="participacion"
                                value="presencial"
                                required
                            >

                            <label
                                for="presencial"
                                class="form-check-label"
                            >
                                Presencial
                            </label>
                        </div>

                        <div class="form-check">
                            <input
                                type="radio"
                                class="form-check-input"
                                id="virtual"
                                name="participacion"
                                value="virtual"
                            >

                            <label
                                for="virtual"
                                class="form-check-label"
                            >
                                Virtual
                            </label>
                        </div>

                    </div>

                    
                    <div class="mb-3">
                        <label for="comentarios" class="form-label">
                            Comentarios
                        </label>

                        <textarea
                            class="form-control"
                            id="comentarios"
                            name="comentarios"
                            rows="4"
                            placeholder="Escriba algún comentario (opcional)"
                        ></textarea>
                    </div>

                    
                    <div class="mb-3 form-check">

                        <input
                            type="checkbox"
                            class="form-check-input"
                            id="terminos"
                            name="terminos"
                            required
                        >

                        <label
                            for="terminos"
                            class="form-check-label"
                        >
                            Acepto los términos y condiciones
                        </label>

                    </div>

                    
                    <div class="d-grid">
                        <button
                            type="submit"
                            class="btn btn-primary"
                        >
                            Registrarme
                        </button>
                    </div>

                </form>

            </div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
